  <div class="mb4">
    <strong>Boat:</strong> Merrit 25<br/>
    <strong>Crew:</strong> Henrik, Timo<br/>
    <strong>Conditions:</strong> 15 knots, high waves<br/>
    <strong>Distance:</strong> <span id="distance"></span> nautical miles<br/>
  </div>
  <div id="map" style="height: 60vh; width: 100%; border: 1px solid #ccc;"></div>
</div>

<script type="text/coffeescript" charset="utf-8">

  class Point
    constructor: (p)

  haversine = (start,end) ->
    Number.prototype.toRad = -> this * Math.PI / 180
    R = 3441 # nautical mile constant
    dLat = (end[0] - start[0]).toRad()
    dLon = (end[1] - start[1]).toRad()
    lat1 = (start[0])
    lat2 = (end[0])
    a = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.sin(dLon / 2) * Math.sin(dLon / 2) * Math.cos(lat1) * Math.cos(lat2)
    c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a))
    R * c

  pointToLatLng = (point) -> [parseFloat(point.getAttribute('lat')), parseFloat(point.getAttribute('lon'))]

  trackSource = document.getElementById('gpx-source').textContent;
  trackDoc = $.parseXML(trackSource)
  track = $(trackDoc)

  points = (pointToLatLng(p) for p in track.find("trkpt"))

  d = 0; d += haversine(points[p],points[p+1]) for p in [0..(points.length-2)]
  document.getElementById('distance').innerHTML = d.toFixed(2)
</script>

<script>
(function () {
  function htmlCollectionMap(collection, cb) {
    var transformed = new Array(collection.length);
    for (var i = 0; i < collection.length; i++) {
      transformed[i] = cb(collection.item(i), i);
    }
    return transformed;
  }

  function pointToLatLng(point) {
    return [parseFloat(point.getAttribute('lat')), parseFloat(point.getAttribute('lon'))];
  }

  var gpxSource = document.getElementById('gpx-source').textContent;

  if (!gpxSource.match("xml")) {
    e=document.getElementById('map');
    e.innerHTML='<b>No track available.</b>';
    e.style.height = '';
    e.style.marginTop = '60px';
    return;
  }

  var parser = new DOMParser();
  var gpx = parser.parseFromString(gpxSource, "text/xml");
  var colors = ['red', 'blue', 'green'];

  var bounds;
  var map = L.map('map', {maxZoom: '9999'});
  htmlCollectionMap(gpx.getElementsByTagName('trkseg'), function (segment, idx) {
    var points = htmlCollectionMap(segment.getElementsByTagName('trkpt'), pointToLatLng);
    bounds = bounds ? bounds.extend(points) : new L.LatLngBounds(points);
    L.polyline(points, {color: colors[idx % colors.length]}).addTo(map);
    L.polylineDecorator(points, {
      patterns: [
        {
          offset: 25, repeat: 25, symbol: L.Symbol.arrowHead({
            pixelSize: 10,
            pathOptions: {
              fillOpacity: 1,
              weight: 0,
              color: colors[idx % colors.length]
            }
          })
        },
      ],
    }).addTo(map);
  });
  map.fitBounds(bounds);
  
  
  var noaaLayer = new L.TileLayer.EsriRest("https://gis.charttools.noaa.gov/arcgis/rest/services/MCS/ENCOnline/MapServer/exts/Maritime%20Chart%20Server/MapServer", {
      layers: '0,1,2,3,4,5,6,7',
      transparent: true,
      attribution: 'Charts from NOAA',
      display_params: JSON.stringify({
        "ECDISParameters": {
          "version":"1.0",
          "StaticParameters":{
            "Parameter":[
              {"name":"AreaSymbolizationType","value":2},
              {"name":"PointSymbolizationType","value":2}
            ]
          },
          "DynamicParameters":{
            "Parameter": [
              {"name":"ColorScheme","value":1},
              {"name":"DisplayDepthUnits","value":2},
              {"name":"TwoDepthShades","value":1},
              {"name":"DisplayNOBJNM","value":2},
              {"name":"HonorScamin","value":2},
              {"name":"ShallowDepthPattern","value":1},
              {"name":"ShallowContour","value":2},
              {"name":"SafetyContour","value":10},
              {"name":"DeepContour","value":30},
              {"name":"DisplayCategory","value":"1,2,4"}
            ]
          }
        }
      })
  });
  
  
  var osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap contributors'
  });
  
  
  noaaLayer.on('tileerror', function() {
    console.log('NOAA charts failed, switching to OpenStreetMap');
    map.removeLayer(noaaLayer);
    osmLayer.addTo(map);
  });
  
  noaaLayer.addTo(map);
})();
</script>
